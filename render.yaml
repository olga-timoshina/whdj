databases:
  - name: warehouse-db
    plan: free
    databaseName: warehouse_db
    user: warehouse_user

services:
  - type: web
    name: warehouse-django
    runtime: python
    plan: free

    buildCommand: "bash build.sh"

    startCommand: "python -m gunicorn config.wsgi:application"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: WEB_CONCURRENCY
        value: "1"